<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>一枚のガラス</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --font: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', YuGothic, Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed;
    inset: 0;
    font-family: var(--font);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wall {
    position: fixed;
    left: 0;
    top: 0;
    display: block;
    touch-action: none;
  }
  #ui {
    position: fixed;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  #ui.on {
    opacity: 1;
    pointer-events: auto;
  }
  #word {
    width: min(320px, calc(100vw - 64px));
    box-sizing: border-box;
    padding: 8px 4px;
    border: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 0;
    background: transparent;
    color: #fff;
    font: 700 18px/1.4 var(--font);
    text-align: center;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
    -webkit-appearance: none;
    appearance: none;
  }
  #word::placeholder {
    color: rgba(255, 255, 255, 0.45);
  }
  #word:focus {
    border-bottom-color: rgba(255, 255, 255, 0.85);
  }
  #hint {
    margin: 0;
    padding: 0 16px;
    font-size: 12px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.45);
    text-align: center;
    transition: opacity 0.8s ease;
  }
  #hint.off {
    opacity: 0;
  }
  #hint span {
    display: block;
  }
  #numbers {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(16px, env(safe-area-inset-bottom));
    margin: 0;
    padding: 0 16px;
    font-size: 11px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.5);
    text-align: center;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #numbers span {
    display: inline-block;
    margin: 0 0.5em;
    text-wrap: balance;
  }
  #diag {
    position: fixed;
    left: 0;
    right: 0;
    top: max(8px, env(safe-area-inset-top));
    margin: 0;
    padding: 0 12px;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #9f9;
    word-break: break-all;
    pointer-events: none;
  }
  body.nogl #ui {
    display: none;
  }
</style>
</head>
<body>
<canvas id="wall" aria-label="板を通った光が映る壁"></canvas>
<div id="ui">
  <input id="word" type="text" maxlength="24" placeholder="言葉をどうぞ（6字まで）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="言葉">
  <p id="hint"><span>上下になぞると、板から壁までの距離が変わる</span><span>左右になぞると、光の向きが変わる</span></p>
</div>
<p id="numbers"></p>
<p id="diag" hidden></p>
<noscript><p style="position:fixed;left:0;right:0;top:45%;text-align:center">光を描くには JavaScript が要る</p></noscript>
<script type="module" src="./main.js"></script>
</body>
</html>
